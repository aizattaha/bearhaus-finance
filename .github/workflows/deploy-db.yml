# BearHaus — database deploy
# Any migration that lands on main under supabase/migrations/ is pushed to the
# production Supabase project automatically — but only after the whole migration
# chain has been applied from nothing to a scratch Postgres and the SQL tests in
# tools/sql-tests/ pass. The Supabase CLI only applies versions the remote has
# not seen, so re-runs are safe.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — the project ref (diqaezhdxloqhglndqrq)
#   SUPABASE_DB_PASSWORD   — the database password (Supabase → Project Settings → Database)
name: Deploy database migrations
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'tools/sql-tests/**']
  pull_request:
    paths: ['supabase/migrations/**', 'tools/sql-tests/**']
  workflow_dispatch:
# one deploy at a time, never cancelled half-way; the workflow only needs to read the repo
concurrency:
  group: deploy-db
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    name: Migrations from scratch + SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17   # production runs Postgres 17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      migrations: ${{ steps.changed.outputs.migrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # to see what this push changed
      - name: Apply every migration to an empty database, then test
        run: tools/sql-tests/run.sh "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
      - name: Did this push change a migration?
        # a tests-only push is tested but not deployed: no snapshot, no push (Bundle B). A manual run always deploys.
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- supabase/migrations; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"; echo "tests only: nothing to deploy"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi
  push-migrations:
    needs: test
    # production only from main (Bundle B, ENG-10), and only when a migration changed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.120.0   # pinned: a new CLI release never touches production untested
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Encrypted snapshot before the push
        # a restore point for this deploy; encrypted like the daily backup, kept 14 days
        run: |
          set -o pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::BACKUP_PASSPHRASE missing — no snapshot, no deploy"; exit 1; fi
          supabase db dump --linked -f schema.sql
          supabase db dump --linked --data-only -f data.sql
          cat schema.sql data.sql > snapshot.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "pre-deploy-${GITHUB_SHA::7}.sql.gpg" snapshot.sql
          shred -u schema.sql data.sql snapshot.sql
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-deploy-${{ github.sha }}
          path: pre-deploy-*.sql.gpg
          retention-days: 14
          if-no-files-found: error
      - name: Push migrations
        # the full log is only readable in the browser; surface the tail of any failure as an
        # annotation too, so it can be read through the API
        run: |
          set -o pipefail
          supabase db push 2>&1 | tee push.log || { echo "::error title=supabase db push failed::$(tail -c 800 push.log | tr '\n' ' ' | tr '\r' ' ')"; exit 1; }
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
