# BearHaus — nightly money check (v2 sprint 2)
# Every night 16:30 UTC (02:30/03:30 Melbourne) and on demand: runs public.bh_money_check() on production —
# read-only counts of things that should never happen (a broken transfer, plan rows with no apply record,
# a fund purchase in the wrong currency…). A "fail" line with a count above zero fails the job, and GitHub
# emails Aizat. The repository is PUBLIC: the log shows check names and counts only, never amounts.
# Uses the deploy secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID (no database password needed).
name: Money check
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the read-only checks (counts only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query": "select check_name, severity, bad from public.bh_money_check() order by severity, check_name"}')
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error title=Money check::couldn't run the check (HTTP $code)"; head -c 300 resp.json; echo; exit 1
          fi
          if ! jq -e 'type == "array" and length > 0' resp.json >/dev/null; then
            echo "::error title=Money check::unexpected reply"; head -c 300 resp.json; echo; exit 1
          fi
          jq -r '.[] | "\(.severity)\t\(.bad)\t\(.check_name)"' resp.json
          fails=$(jq '[.[] | select(.severity == "fail" and .bad > 0)] | length' resp.json)
          warns=$(jq '[.[] | select(.severity == "warn" and .bad > 0)] | length' resp.json)
          rm -f resp.json
          if [ "$warns" -gt 0 ]; then echo "::warning title=Money check::$warns checks worth a look (see the list)"; fi
          if [ "$fails" -gt 0 ]; then echo "::error title=Money check::$fails checks failed — see the list above"; exit 1; fi
          echo "money check clean"
