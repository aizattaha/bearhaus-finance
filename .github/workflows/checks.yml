# BearHaus — checks that run on every push and pull request (v2 sprint 1).
#  · private-data guard: no real figures, household ids, personal emails or statements in this public repo
#  · JavaScript syntax: every inline script of both pages compiles
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    name: Private-data guard + JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Private-data guard
        run: tools/ci/private-data-guard.sh
      - name: JavaScript syntax
        run: node tools/ci/check-js.mjs
